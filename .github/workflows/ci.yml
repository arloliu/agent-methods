name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Fixtures (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test fixture graphs and reference rewrites
        run: python -B skills/history-cleanup/evals/test_fixtures.py
      - name: Test progress-check workers, harness, and verifier
        run: python -B skills/progress-check/evals/test_fixtures.py
      - name: Test portable evaluation preparation
        run: python -B scripts/test_prepare_history_evaluation.py
      - name: Install artifact validation dependencies
        run: python -m pip install -r scripts/requirements-validation.txt
      - name: Test artifact validator
        run: python -B scripts/test_validate_artifacts.py
      - name: Validate skill metadata and Markdown file targets
        run: python -B scripts/validate_artifacts.py

  lint:
    name: Python lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install lint tool
        run: python -m pip install ruff==0.16.4
      - name: Lint Python
        run: >-
          ruff check --isolated --no-cache --select E4,E7,E9,F,I
          scripts/*.py
          skills/history-cleanup/evals/*.py
          skills/history-cleanup/evals/fixtures/*/setup.py
          skills/progress-check/evals/*.py
          skills/progress-check/evals/fixtures/*.py
      - name: Check Python formatting
        run: >-
          ruff format --isolated --check --no-cache
          scripts/*.py
          skills/history-cleanup/evals/*.py
          skills/history-cleanup/evals/fixtures/*/setup.py
          skills/progress-check/evals/*.py
          skills/progress-check/evals/fixtures/*.py
      - name: Check commit whitespace
        run: git show --format= --check HEAD
